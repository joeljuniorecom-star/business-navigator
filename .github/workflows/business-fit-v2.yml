name: Business Fit V2

on:
  pull_request:
    paths:
      - "src/data/v2/**"
      - "scripts/validate-business-fit-v2.ts"
      - "tsconfig.json"
      - ".github/workflows/business-fit-v2.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate V2 datasets
        run: bun scripts/validate-business-fit-v2.ts
      - name: Build application
        run: bun run build
