name: Business Fit V2 + BOS V1

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Validate Business Fit V2 datasets
        run: bun scripts/validate-business-fit-v2.ts
      - name: Test BOS V1 service
        run: bun scripts/bos-service.test.ts
      - name: Lint
        run: bun run lint
      - name: Build application
        run: bun run build
